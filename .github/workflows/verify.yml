name: Verify proofs and experiments

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: "2"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up pinned Lean and Mathlib dependencies
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "true"
      - name: Expose native Elan path on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $elanBin = Join-Path $env:USERPROFILE '.elan\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $elanBin 'lake.exe'))) {
            throw "Lake executable was not installed in $elanBin"
          }
          $elanBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build, audit and reproduce examples
        run: python scripts/run_checks.py
      - name: Preserve check logs and experiment results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: build/
          if-no-files-found: warn
          retention-days: 14
