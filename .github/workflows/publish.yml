name: Publish verified v1.0.1 release

on:
  push:
    branches: [release/v1.0.1]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-v1.0.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify source, require both CI platforms, and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: python3 scripts/publish_release.py
